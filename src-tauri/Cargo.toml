[package]
name = "kairo-app"
version = "0.1.0"
description = "KaïroOS - Frontend d'arcade custom complet sous Windows"
authors = ["Flow (Florian) — FlowCreativeStudio <https://github.com/NayrolfRdgs>"]
edition = "2021"

[lib]
name = "kairo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kairo-core = { path = "../crates/kairo-core" }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="hubPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="640" height="360" fill="url(#hubBg)"/>

  <!-- Top Header Plein Écran -->
  <rect x="0" y="0" width="640" height="46" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="20" y="9" width="28" height="28" rx="8" fill="url(#hubPurple)"/>
  <text x="34" y="28" fill="#ffffff" font-size="16" text-anchor="middle">🎮</text>
  <text x="56" y="28" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14">KAÏRO <tspan fill="#a855f7">HUB</tspan></text>

  <rect x="180" y="10" width="240" height="26" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="195" y="27" fill="#64748b" font-family="sans-serif" font-size="10">🔍 Rechercher un jeu, une console...</text>

  <rect x="535" y="10" width="85" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="577" y="27" fill="#cbd5e1" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Paramètres</text>

  <!-- Rayon 1 : Consoles -->
  <g transform="translate(20, 56)">
    <text x="0" y="14" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="12">🕹️ Consoles &amp; Systèmes</text>
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="110" height="52" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
      <text x="14" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">SNES</text>
      <text x="14" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8">Nintendo</text>

      <rect x="120" y="0" width="110" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="134" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">Mega Drive</text>
      <text x="134" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8">Sega</text>

      <rect x="240" y="0" width="110" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="254" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">Arcade</text>
      <text x="254" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8">MAME / NeoGeo</text>

      <rect x="360" y="0" width="110" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="374" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">PlayStation</text>
      <text x="374" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8">Sony</text>

      <rect x="480" y="0" width="110" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="494" y="26" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">Nintendo 64</text>
      <text x="494" y="40" fill="#94a3b8" font-family="sans-serif" font-size="8">Nintendo</text>
    </g>
  </g>

  <!-- Rayon 2 : Favoris -->
  <g transform="translate(20, 144)">
    <text x="0" y="14" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="12">⭐ Vos Jeux Favoris</text>
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="88" height="116" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
      <text x="44" y="52" font-size="26" text-anchor="middle">🍄</text>
      <text x="8" y="98" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8">Super Mario</text>

      <rect x="98" y="0" width="88" height="116" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="142" y="52" font-size="26" text-anchor="middle">🗡️</text>
      <text x="106" y="98" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8">Zelda</text>

      <rect x="196" y="0" width="88" height="116" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="240" y="52" font-size="26" text-anchor="middle">🥊</text>
      <text x="204" y="98" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8">Street Fighter</text>

      <rect x="294" y="0" width="88" height="116" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="338" y="52" font-size="26" text-anchor="middle">🦔</text>
      <text x="302" y="98" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8">Sonic</text>

      <rect x="392" y="0" width="88" height="116" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="436" y="52" font-size="26" text-anchor="middle">🏎️</text>
      <text x="400" y="98" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8">Mario Kart</text>

      <rect x="490" y="0" width="88" height="116" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="534" y="52" font-size="26" text-anchor="middle">🐉</text>
      <text x="498" y="98" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8">Pokemon</text>
    </g>
  </g>

  <!-- Rayon 3 : Modes de Jeux -->
  <g transform="translate(20, 296)">
    <rect x="0" y="0" width="140" height="42" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="14" y="26" fill="#f43f5e" font-family="sans-serif" font-weight="900" font-size="11">👥 2 Joueurs</text>

    <rect x="150" y="0" width="140" height="42" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="164" y="26" fill="#f59e0b" font-family="sans-serif" font-weight="900" font-size="11">⚔️ Combat</text>

    <rect x="300" y="0" width="140" height="42" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="314" y="26" fill="#ec4899" font-family="sans-serif" font-weight="900" font-size="11">🎮 Plateformes</text>

    <rect x="450" y="0" width="140" height="42" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="464" y="26" fill="#8b5cf6" font-family="sans-serif" font-weight="900" font-size="11">🕒 Récents</text>
  </g>

  <!-- Badge Hub -->
  <rect x="520" y="325" width="100" height="22" rx="6" fill="#7c3aed"/>
  <text x="570" y="340" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">KAÏRO HUB</text>
</svg>

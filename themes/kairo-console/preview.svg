<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0a0e17" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="pink-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond Principal -->
  <rect width="800" height="450" fill="url(#bg-grad)" />

  <!-- Hero Backdrop Artwork Art -->
  <g opacity="0.35">
    <circle cx="620" cy="160" r="140" fill="#f43f5e" filter="blur(50px)" />
    <circle cx="700" cy="200" r="90" fill="#38bdf8" filter="blur(40px)" />
    <!-- Silhouette caractère arcade -->
    <path d="M 540 280 C 530 180, 600 110, 670 120 C 730 130, 770 200, 750 280 Z" fill="#2d3748" />
  </g>

  <rect width="800" height="280" fill="url(#hero-grad)" />

  <!-- Top Bar -->
  <text x="35" y="38" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" letter-spacing="1">Kaïro</text>
  <rect x="90" y="24" width="70" height="18" rx="9" fill="#ffffff" fill-opacity="0.12" />
  <text x="125" y="37" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="800" font-size="9">CONSOLE</text>

  <rect x="690" y="22" width="75" height="22" rx="11" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="704" cy="33" r="5" fill="#94a3b8" />
  <text x="736" y="37" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="11">17:56</text>

  <!-- Hero Content -->
  <text x="35" y="105" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">CLASSIC KONG COMPLETE</text>

  <!-- Stars & Metadata -->
  <g transform="translate(35, 120)">
    <text x="0" y="10" fill="#fbbf24" font-size="12">★★★★★</text>
    <text x="65" y="10" fill="#e2e8f0" font-family="monospace" font-size="10" font-weight="bold">4.5</text>
    <text x="95" y="10" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold">SNES • ARCADE • 2 JOUEURS</text>
  </g>

  <!-- Hero Buttons -->
  <g transform="translate(35, 145)">
    <!-- Bouton [A] JOUER -->
    <rect width="125" height="34" rx="10" fill="url(#pink-btn)" />
    <circle cx="22" cy="17" r="8" fill="#ffffff" fill-opacity="0.25" />
    <text x="22" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="900">A</text>
    <text x="70" y="22" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" letter-spacing="1">JOUER</text>

    <!-- Bouton (X) Favori -->
    <rect x="135" y="0" width="85" height="34" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="177" y="21" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">X  Favori</text>

    <!-- Bouton (Y) Options -->
    <rect x="228" y="0" width="90" height="34" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="273" y="21" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">Y  Options</text>
  </g>

  <!-- Horizontal Carousel -->
  <g transform="translate(0, 215)">
    <!-- Card 1 -->
    <g transform="translate(35, 15)">
      <rect width="130" height="150" rx="14" fill="#182030" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
      <rect x="15" y="20" width="100" height="90" rx="8" fill="#243048" />
      <text x="65" y="130" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">KONG</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(180, 15)">
      <rect width="130" height="150" rx="14" fill="#182030" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
      <rect x="15" y="20" width="100" height="90" rx="8" fill="#2d3748" />
      <text x="65" y="130" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">MARIO 64</text>
    </g>

    <!-- Card 3 : Focused (UWOL) -->
    <g transform="translate(320, 0)">
      <rect width="155" height="180" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="3" filter="url(#neon-glow)" />
      <rect width="155" height="180" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="3" />
      <rect x="15" y="20" width="125" height="110" rx="10" fill="#f43f5e" fill-opacity="0.25" />
      <text x="77" y="80" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="16" font-weight="900">Uwol</text>
      <text x="77" y="155" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="900">UWOL QUEST</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(490, 15)">
      <rect width="130" height="150" rx="14" fill="#182030" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
      <rect x="15" y="20" width="100" height="90" rx="8" fill="#243048" />
      <text x="65" y="130" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">DUNGEON D14</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(635, 15)">
      <rect width="130" height="150" rx="14" fill="#182030" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
      <rect x="15" y="20" width="100" height="90" rx="8" fill="#2d3748" />
      <text x="65" y="130" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">ZELDA</text>
    </g>
  </g>

  <!-- Bottom Controller Bar -->
  <rect y="415" width="800" height="35" fill="#000000" fill-opacity="0.75" />
  <line x1="0" y1="415" x2="800" y2="415" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <g transform="translate(35, 432)" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">
    <text x="0" y="0">Ⓐ OUVRIR</text>
    <text x="80" y="0">Ⓧ FAVORI</text>
    <text x="160" y="0">[LB/RB] SYSTÈMES</text>
    <text x="280" y="0">Ⓑ RETOUR/PARAMÈTRES</text>
    <text x="430" y="0">Ⓨ OPTIONS</text>
  </g>
</svg>

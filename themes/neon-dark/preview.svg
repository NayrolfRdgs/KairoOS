<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080914" />
      <stop offset="100%" stop-color="#0f1026" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Sidebar -->
  <rect x="0" y="0" width="140" height="400" fill="#0b0c1e" />
  <line x1="140" y1="0" x2="140" y2="400" stroke="#22254d" stroke-width="2" />

  <!-- Sidebar items -->
  <rect x="15" y="30" width="110" height="24" rx="6" fill="#ff007f" opacity="0.2" />
  <rect x="25" y="38" width="50" height="8" rx="3" fill="#ff007f" />
  <rect x="25" y="70" width="65" height="8" rx="3" fill="#6366f1" opacity="0.6" />
  <rect x="25" y="95" width="55" height="8" rx="3" fill="#6366f1" opacity="0.6" />
  <rect x="25" y="120" width="70" height="8" rx="3" fill="#6366f1" opacity="0.6" />

  <!-- Top bar -->
  <rect x="160" y="25" width="220" height="12" rx="4" fill="#ffffff" />
  <rect x="160" y="45" width="120" height="8" rx="3" fill="#00f5ff" filter="url(#glow)" />

  <!-- Game cards -->
  <g transform="translate(160, 80)">
    <!-- Card 1 Focused with Neon Glow -->
    <rect x="0" y="0" width="125" height="180" rx="12" fill="#151733" stroke="#ff007f" stroke-width="3" filter="url(#glow)" />
    <rect x="15" y="20" width="95" height="100" rx="6" fill="#22254d" />
    <circle cx="62" cy="70" r="22" fill="#ff007f" opacity="0.8" />
    <rect x="15" y="135" width="75" height="8" rx="3" fill="#ffffff" />
    <rect x="15" y="150" width="45" height="6" rx="2" fill="#a5b4fc" />

    <!-- Card 2 -->
    <rect x="145" y="10" width="125" height="170" rx="12" fill="#151733" stroke="#22254d" stroke-width="1.5" />
    <rect x="160" y="30" width="95" height="95" rx="6" fill="#1b1e40" />
    <circle cx="207" cy="77" r="18" fill="#00f5ff" opacity="0.6" />
    <rect x="160" y="140" width="70" height="8" rx="3" fill="#ffffff" opacity="0.8" />
    <rect x="160" y="155" width="40" height="6" rx="2" fill="#6366f1" />

    <!-- Card 3 -->
    <rect x="290" y="10" width="125" height="170" rx="12" fill="#151733" stroke="#22254d" stroke-width="1.5" />
    <rect x="305" y="30" width="95" height="95" rx="6" fill="#1b1e40" />
    <circle cx="352" cy="77" r="18" fill="#a855f7" opacity="0.6" />
    <rect x="305" y="140" width="65" height="8" rx="3" fill="#ffffff" opacity="0.8" />
    <rect x="305" y="155" width="45" height="6" rx="2" fill="#6366f1" />
  </g>

  <!-- Bottom neon bar -->
  <line x1="160" y1="360" x2="560" y2="360" stroke="url(#neon)" stroke-width="2" filter="url(#glow)" />
  <text x="160" y="385" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="bold">NEON DARK EDITION • 100% RETRO ARCADE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <radialGradient id="ambient-pink" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambient-blue" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#080c14" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="pink-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond Principal & Ambiance -->
  <rect width="800" height="450" fill="url(#bg-grad)" />
  <rect width="800" height="450" fill="url(#ambient-pink)" />
  <rect width="800" height="450" fill="url(#ambient-blue)" />

  <!-- Hero Backdrop Artwork (Silhouette rétro immersive) -->
  <g opacity="0.38">
    <circle cx="640" cy="150" r="150" fill="#f43f5e" filter="blur(60px)" />
    <circle cx="720" cy="210" r="100" fill="#38bdf8" filter="blur(45px)" />
    <path d="M 530 290 C 520 170, 600 95, 680 110 C 750 125, 790 200, 760 290 Z" fill="#1e293b" />
    <!-- Yeux / traits légers -->
    <ellipse cx="660" cy="160" rx="14" ry="18" fill="#f8fafc" />
    <ellipse cx="695" cy="160" rx="14" ry="18" fill="#f8fafc" />
    <circle cx="663" cy="160" r="7" fill="#0f172a" />
    <circle cx="698" cy="160" r="7" fill="#0f172a" />
  </g>

  <!-- Gradient de fondu du Hero -->
  <rect width="800" height="290" fill="url(#hero-grad)" />

  <!-- Top Bar -->
  <g transform="translate(35, 20)">
    <text x="0" y="16" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" letter-spacing="1">Kaïro</text>
    <rect x="58" y="3" width="92" height="18" rx="9" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
    <text x="104" y="15" text-anchor="middle" fill="#f43f5e" font-family="'Outfit', sans-serif" font-weight="800" font-size="9" letter-spacing="0.5">FLOO EDITION</text>

    <!-- Statut & Horloge -->
    <g transform="translate(640, 0)">
      <rect width="90" height="24" rx="12" fill="#000000" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.12" />
      <circle cx="16" cy="12" r="5" fill="#94a3b8" />
      <text x="50" y="16" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-weight="bold" font-size="11">17:56</text>
    </g>
  </g>

  <!-- Hero Content -->
  <g transform="translate(35, 70)">
    <!-- Titre -->
    <text x="0" y="35" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">CLASSIC KONG COMPLETE</text>

    <!-- Étoiles & Métadonnées -->
    <g transform="translate(0, 52)">
      <text x="0" y="10" fill="#fbbf24" font-size="13">★★★★★</text>
      <text x="68" y="10" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">4.5</text>
      <circle cx="96" cy="7" r="2" fill="#64748b" />
      <text x="106" y="10" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SNES · ARCADE · 2 JOUEURS</text>
    </g>

    <!-- Boutons d'actions rapides -->
    <g transform="translate(0, 78)">
      <!-- Bouton [A] JOUER -->
      <rect width="130" height="36" rx="10" fill="url(#pink-btn)" filter="url(#neon-glow)" />
      <rect width="130" height="36" rx="10" fill="url(#pink-btn)" />
      <circle cx="24" cy="18" r="9" fill="#ffffff" fill-opacity="0.25" />
      <text x="24" y="22" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="900">A</text>
      <text x="75" y="23" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" letter-spacing="1">JOUER</text>

      <!-- Bouton (X) Favori -->
      <rect x="142" y="0" width="95" height="36" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16" />
      <circle cx="160" cy="18" r="8" fill="#ffffff" fill-opacity="0.15" />
      <text x="160" y="22" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">X</text>
      <text x="195" y="23" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">Favori</text>

      <!-- Bouton (Y) Options -->
      <rect x="247" y="0" width="100" height="36" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16" />
      <circle cx="266" cy="18" r="8" fill="#ffffff" fill-opacity="0.15" />
      <text x="266" y="22" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">Y</text>
      <text x="303" y="23" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">Options</text>
    </g>
  </g>

  <!-- Carrousel Horizontal -->
  <g transform="translate(0, 215)">
    <!-- Carte 1 -->
    <g transform="translate(35, 14)">
      <rect width="130" height="150" rx="14" fill="#131d31" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
      <rect x="12" y="16" width="106" height="92" rx="8" fill="#1e293b" />
      <text x="65" y="132" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">KONG</text>
    </g>

    <!-- Carte 2 -->
    <g transform="translate(180, 14)">
      <rect width="130" height="150" rx="14" fill="#131d31" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
      <rect x="12" y="16" width="106" height="92" rx="8" fill="#1e293b" />
      <text x="65" y="132" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">MARIO 64</text>
    </g>

    <!-- Carte 3 : FOCALISÉE (UWOL) -->
    <g transform="translate(325, 0)">
      <rect width="150" height="175" rx="16" fill="#18243d" stroke="#f43f5e" stroke-width="3" filter="url(#neon-glow)" />
      <rect width="150" height="175" rx="16" fill="#18243d" stroke="#f43f5e" stroke-width="3" />
      <rect x="12" y="16" width="126" height="110" rx="10" fill="#f43f5e" fill-opacity="0.2" />
      <text x="75" y="76" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="16" font-weight="900">Uwol</text>
      <text x="75" y="152" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" letter-spacing="0.5">UWOL QUEST</text>
    </g>

    <!-- Carte 4 -->
    <g transform="translate(490, 14)">
      <rect width="130" height="150" rx="14" fill="#131d31" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
      <rect x="12" y="16" width="106" height="92" rx="8" fill="#1e293b" />
      <text x="65" y="132" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">DUNGEON D14</text>
    </g>

    <!-- Carte 5 -->
    <g transform="translate(635, 14)">
      <rect width="130" height="150" rx="14" fill="#131d31" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
      <rect x="12" y="16" width="106" height="92" rx="8" fill="#1e293b" />
      <text x="65" y="132" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">D14</text>
    </g>
  </g>

  <!-- Barre de navigation manette en bas (Bottom Bar) -->
  <g transform="translate(0, 412)">
    <rect width="800" height="38" fill="#080c14" fill-opacity="0.9" />
    <line x1="0" y1="0" x2="800" y2="0" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <g transform="translate(35, 23)" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">
      <text x="0" y="0">Ⓐ OUVRIR</text>
      <text x="90" y="0">Ⓧ FAVORI</text>
      <text x="180" y="0">[LB] SYSTÈME PRÉC.</text>
      <text x="320" y="0">Ⓑ PARAMÈTRES</text>
      <text x="440" y="0">Ⓨ OPTIONS</text>
      <text x="535" y="0">[RB] SYSTÈME SUIV.</text>
    </g>
  </g>
</svg>

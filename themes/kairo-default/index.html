<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaïro OS — Classic Arcade</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app" class="classic-layout">
    <!-- ============================================================ -->
    <!-- BARRE LATÉRALE GAUCHE                                        -->
    <!-- ============================================================ -->
    <aside class="sidebar">
      <!-- En-tête Sidebar -->
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">🎮</div>
          <div class="brand-text">
            <h2>KAÏRO</h2>
            <span class="version-tag">OS ARCADE</span>
          </div>
        </div>
      </div>

      <!-- Navigation Catégories -->
      <nav class="sidebar-nav">
        <div class="nav-section-title">BIBLIOTHÈQUE</div>
        <button id="nav-all" class="nav-item active">
          <span class="nav-icon">🕹️</span>
          <span class="nav-label">Tous les Jeux</span>
          <span id="badge-all" class="count-badge">0</span>
        </button>

        <button id="nav-favs" class="nav-item">
          <span class="nav-icon">⭐</span>
          <span class="nav-label">Favoris</span>
          <span id="badge-favs" class="count-badge">0</span>
        </button>

        <button id="nav-2p" class="nav-item">
          <span class="nav-icon">👥</span>
          <span class="nav-label">2 Joueurs</span>
          <span id="badge-2p" class="count-badge">0</span>
        </button>

        <button id="nav-recent" class="nav-item">
          <span class="nav-icon">🕒</span>
          <span class="nav-label">Récemment Joués</span>
          <span id="badge-recent" class="count-badge">0</span>
        </button>

        <!-- Liste des Consoles -->
        <div class="nav-section-title" style="margin-top: 20px;">CONSOLES & SYSTÈMES</div>
        <div id="systems-list" class="systems-list">
          <!-- Injecté dynamiquement par app.js -->
        </div>
      </nav>

      <!-- Pied de la Sidebar -->
      <div class="sidebar-footer">
        <div class="status-box">
          <span class="status-dot"></span>
          <span id="status-label" class="status-text">Borne prête</span>
        </div>
        <div class="sidebar-actions">
          <button id="btn-gamepad-settings" class="action-btn" title="Configuration Manettes">🎮</button>
          <button id="btn-open-settings" class="action-btn primary" title="Paramètres">⚙️ Paramètres</button>
        </div>
      </div>
    </aside>

    <!-- ============================================================ -->
    <!-- CONTENU PRINCIPAL                                            -->
    <!-- ============================================================ -->
    <main class="main-content">
      <!-- Barre Supérieure de Recherche -->
      <header class="top-header">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-bar" placeholder="Rechercher un titre, une console, un genre..." />
          <button id="btn-clear-search" class="clear-btn" style="display:none;">✕</button>
        </div>

        <div class="quick-stats" id="active-filter-label">
          Tous les Jeux
        </div>
      </header>

      <div class="scroll-area">
        <!-- Hero Showcase Banner -->
        <section class="hero-showcase" id="hero-banner">
          <div class="hero-backdrop" id="hero-bg"></div>
          <div class="hero-content">
            <div class="hero-badge" id="hero-system-pill">SUPER NINTENDO</div>
            <h1 class="hero-title" id="hero-title">Super Mario World</h1>
            <p class="hero-synopsis" id="hero-synopsis">
              Rejoignez Mario et son fidèle destrier Yoshi dans une aventure légendaire à travers Dinosaur Land.
            </p>
            <div class="hero-actions">
              <button id="hero-play-btn" class="hero-btn-play">
                <span>▶</span> Lancer la Partie (A)
              </button>
              <button id="hero-details-btn" class="hero-btn-info">
                <span>ℹ</span> Fiche Complète (Y)
              </button>
            </div>
          </div>
          <div class="hero-pagination" id="hero-dots"></div>
        </section>

        <!-- Grille du Catalogue -->
        <section class="catalog-section">
          <div class="catalog-header">
            <h2 id="catalog-title">Tous les Jeux</h2>
            <span id="catalog-count" class="catalog-count-pill">0 JEUX</span>
          </div>

          <div class="games-grid" id="catalog-grid">
            <!-- Injecté dynamiquement par app.js -->
          </div>
        </section>
      </div>

      <!-- Footer Manette -->
      <footer class="gamepad-footer">
        <div class="prompt"><span class="badge a">A</span> Lancer</div>
        <div class="prompt"><span class="badge b">B</span> Retour</div>
        <div class="prompt"><span class="badge x">X</span> Favori</div>
        <div class="prompt"><span class="badge y">Y</span> Détails</div>
        <div class="prompt"><span class="badge menu">START</span> Paramètres</div>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgDef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="640" height="360" fill="url(#bgDef)"/>

  <!-- Sidebar Gauche -->
  <rect x="0" y="0" width="160" height="360" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="18" y="18" width="28" height="28" rx="8" fill="#e63950"/>
  <text x="32" y="37" fill="#ffffff" font-size="16" text-anchor="middle">👾</text>
  <text x="56" y="37" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14">KAÏRO</text>

  <!-- Menu Sidebar -->
  <rect x="14" y="66" width="132" height="28" rx="8" fill="#e63950"/>
  <text x="32" y="84" fill="#ffffff" font-size="12">🎮</text>
  <text x="52" y="85" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">Tous les Jeux</text>

  <rect x="14" y="102" width="132" height="26" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="32" y="119" fill="#f59e0b" font-size="12">⭐</text>
  <text x="52" y="120" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="11">Favoris</text>

  <rect x="14" y="136" width="132" height="26" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="32" y="153" fill="#ec4899" font-size="12">👥</text>
  <text x="52" y="154" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="11">2 Joueurs</text>

  <rect x="14" y="170" width="132" height="26" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="32" y="187" fill="#3b82f6" font-size="12">🕹️</text>
  <text x="52" y="188" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="11">Consoles</text>

  <!-- Header Droit -->
  <rect x="160" y="0" width="480" height="42" fill="#0f172a88" stroke="#1e293b" stroke-width="1"/>
  <rect x="175" y="8" width="220" height="26" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
  <text x="190" y="25" fill="#64748b" font-family="sans-serif" font-size="10">🔍 Rechercher...</text>

  <!-- Hero Showcase Banner -->
  <g transform="translate(175, 52)">
    <rect width="445" height="96" rx="14" fill="url(#heroGrad)" stroke="#4338ca" stroke-width="1.5"/>
    <text x="24" y="44" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="18">SUPER MARIO WORLD</text>
    <text x="24" y="64" fill="#a5b4fc" font-family="sans-serif" font-size="11">Super Nintendo Entertainment System • 1990</text>
    <rect x="24" y="72" width="70" height="16" rx="4" fill="#e63950"/>
    <text x="59" y="84" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">JOUER (A)</text>
  </g>

  <!-- Grille des Jeux Droite -->
  <g transform="translate(175, 160)">
    <!-- Carte 1 -->
    <rect x="0" y="0" width="102" height="150" rx="10" fill="#1e293b" stroke="#e63950" stroke-width="2.5"/>
    <rect x="4" y="4" width="94" height="106" rx="8" fill="#0b0f19"/>
    <text x="51" y="65" font-size="30" text-anchor="middle">🍄</text>
    <text x="10" y="126" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">Super Mario</text>
    <text x="10" y="140" fill="#64748b" font-family="sans-serif" font-size="8">SNES</text>

    <!-- Carte 2 -->
    <rect x="114" y="0" width="102" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="118" y="4" width="94" height="106" rx="8" fill="#0b0f19"/>
    <text x="165" y="65" font-size="30" text-anchor="middle">🗡️</text>
    <text x="124" y="126" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">Zelda: ALTTP</text>
    <text x="124" y="140" fill="#64748b" font-family="sans-serif" font-size="8">SNES</text>

    <!-- Carte 3 -->
    <rect x="228" y="0" width="102" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="232" y="4" width="94" height="106" rx="8" fill="#0b0f19"/>
    <text x="279" y="65" font-size="30" text-anchor="middle">🥊</text>
    <text x="238" y="126" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">Street Fighter</text>
    <text x="238" y="140" fill="#64748b" font-family="sans-serif" font-size="8">ARCADE</text>

    <!-- Carte 4 -->
    <rect x="342" y="0" width="102" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="346" y="4" width="94" height="106" rx="8" fill="#0b0f19"/>
    <text x="393" y="65" font-size="30" text-anchor="middle">🦔</text>
    <text x="352" y="126" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">Sonic 2</text>
    <text x="352" y="140" fill="#64748b" font-family="sans-serif" font-size="8">MEGADRIVE</text>
  </g>

  <!-- Badge Officiel -->
  <rect x="520" y="325" width="100" height="22" rx="6" fill="#e63950"/>
  <text x="570" y="340" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">CLASSIC ARCADE</text>
</svg>

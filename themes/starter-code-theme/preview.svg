<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="50%" stop-color="#13132e"/>
      <stop offset="100%" stop-color="#060611"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e48"/>
      <stop offset="100%" stop-color="#101026"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Lignes néon de perspective / grille rétro -->
  <path d="M 0 320 L 640 320 M 0 340 L 640 340 M 80 320 L 0 360 M 240 320 L 160 360 M 400 320 L 480 360 M 560 320 L 640 360" stroke="#272752" stroke-width="1.5" opacity="0.6"/>

  <!-- Barre Supérieure -->
  <rect x="0" y="0" width="640" height="46" fill="#13132eb3" stroke="#272752" stroke-width="1"/>
  <rect x="20" y="14" width="46" height="18" rx="5" fill="url(#neonPink)"/>
  <text x="43" y="27" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">NEON</text>
  <text x="75" y="28" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="14">KAÏRO<tspan fill="#06b6d4">OS</tspan></text>
  
  <rect x="180" y="10" width="220" height="26" rx="8" fill="#0a0a1a" stroke="#272752" stroke-width="1"/>
  <text x="195" y="27" fill="#64748b" font-family="sans-serif" font-size="10">🔍 Rechercher un jeu...</text>

  <rect x="540" y="10" width="80" height="26" rx="8" fill="#2563eb"/>
  <text x="580" y="27" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Paramètres</text>

  <!-- Chips Consoles -->
  <rect x="20" y="60" width="80" height="24" rx="12" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="60" y="76" fill="#06b6d4" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Tous</text>

  <rect x="110" y="60" width="90" height="24" rx="12" fill="#181838" stroke="#272752" stroke-width="1"/>
  <text x="155" y="76" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Super Nintendo</text>

  <rect x="210" y="60" width="80" height="24" rx="12" fill="#181838" stroke="#272752" stroke-width="1"/>
  <text x="250" y="76" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Mega Drive</text>

  <rect x="300" y="60" width="70" height="24" rx="12" fill="#181838" stroke="#272752" stroke-width="1"/>
  <text x="335" y="76" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Arcade</text>

  <!-- Cartes de Jeux -->
  <!-- Carte 1 (Focus) -->
  <g transform="translate(20, 100)">
    <rect width="135" height="190" rx="14" fill="url(#cardGlow)" stroke="#ec4899" stroke-width="3" filter="drop-shadow(0px 8px 16px rgba(236,72,153,0.4))"/>
    <rect x="6" y="6" width="123" height="130" rx="10" fill="#06060f"/>
    <text x="67" y="75" font-size="36" text-anchor="middle">🍄</text>
    <text x="14" y="156" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">SUPER MARIO</text>
    <rect x="14" y="165" width="40" height="14" rx="4" fill="#8b5cf6" opacity="0.3"/>
    <text x="34" y="176" fill="#c4b5fd" font-family="sans-serif" font-weight="bold" font-size="8" text-anchor="middle">SNES</text>
  </g>

  <!-- Carte 2 -->
  <g transform="translate(175, 105)">
    <rect width="135" height="185" rx="14" fill="url(#cardGlow)" stroke="#272752" stroke-width="1.5"/>
    <rect x="6" y="6" width="123" height="126" rx="10" fill="#06060f"/>
    <text x="67" y="75" font-size="36" text-anchor="middle">🗡️</text>
    <text x="14" y="152" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">ZELDA III</text>
    <rect x="14" y="161" width="40" height="14" rx="4" fill="#8b5cf6" opacity="0.3"/>
    <text x="34" y="172" fill="#c4b5fd" font-family="sans-serif" font-weight="bold" font-size="8" text-anchor="middle">SNES</text>
  </g>

  <!-- Carte 3 -->
  <g transform="translate(330, 105)">
    <rect width="135" height="185" rx="14" fill="url(#cardGlow)" stroke="#272752" stroke-width="1.5"/>
    <rect x="6" y="6" width="123" height="126" rx="10" fill="#06060f"/>
    <text x="67" y="75" font-size="36" text-anchor="middle">🥊</text>
    <text x="14" y="152" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">STREET FIGHTER</text>
    <rect x="14" y="161" width="50" height="14" rx="4" fill="#8b5cf6" opacity="0.3"/>
    <text x="39" y="172" fill="#c4b5fd" font-family="sans-serif" font-weight="bold" font-size="8" text-anchor="middle">ARCADE</text>
  </g>

  <!-- Carte 4 -->
  <g transform="translate(485, 105)">
    <rect width="135" height="185" rx="14" fill="url(#cardGlow)" stroke="#272752" stroke-width="1.5"/>
    <rect x="6" y="6" width="123" height="126" rx="10" fill="#06060f"/>
    <text x="67" y="75" font-size="36" text-anchor="middle">🦔</text>
    <text x="14" y="152" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">SONIC 2</text>
    <rect x="14" y="161" width="55" height="14" rx="4" fill="#8b5cf6" opacity="0.3"/>
    <text x="41" y="172" fill="#c4b5fd" font-family="sans-serif" font-weight="bold" font-size="8" text-anchor="middle">MEGADRIVE</text>
  </g>

  <!-- Badge Full Code -->
  <rect x="470" y="295" width="150" height="24" rx="12" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
  <text x="545" y="311" fill="#10b981" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">⚡ FULL CODE THEME</text>
</svg>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaïro — Neon Arcade</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cyber-scanlines"></div>

  <div id="app" class="app-layout">
    <!-- Barre Supérieure -->
    <header class="top-nav">
      <div class="brand">
        <div class="brand-badge">NEON</div>
        <h1 class="brand-title">KAÏRO<span>OS</span></h1>
        <span class="games-counter" id="total-games-pill">0 JEUX</span>
      </div>

      <!-- Recherche en direct -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Rechercher un jeu ou une console..." autocomplete="off" />
        <button id="clear-search-btn" class="clear-btn" style="display:none;">✕</button>
      </div>

      <!-- Actions de la borne -->
      <div class="actions">
        <button id="gamepad-btn" class="btn-icon" title="Configuration Manette">🎮</button>
        <button id="settings-btn" class="btn-primary" title="Paramètres Kaïro">⚙️ Paramètres</button>
      </div>
    </header>

    <!-- Filtres des Consoles -->
    <nav class="systems-row" id="systems-bar">
      <!-- Rempli dynamiquement par app.js -->
    </nav>

    <!-- Zone Principale : Grille des Jeux -->
    <main class="games-area">
      <div class="section-title">
        <h2 id="current-category-label">Tous les Jeux</h2>
        <span class="legend">Naviguez à la manette (D-Pad) ou souris • (A) pour lancer</span>
      </div>

      <div class="games-grid" id="games-grid">
        <!-- Rempli dynamiquement par app.js -->
      </div>
    </main>

    <!-- Footer Manette -->
    <footer class="gamepad-bar">
      <div class="tip"><span class="key">D-PAD</span> Déplacer</div>
      <div class="tip"><span class="key btn-a">A</span> Lancer</div>
      <div class="tip"><span class="key btn-b">B</span> Retour / Effacer</div>
      <div class="tip"><span class="key btn-x">X</span> Favori</div>
      <div class="tip"><span class="key btn-y">Y</span> Fiche Détails</div>
      <div class="tip"><span class="key btn-menu">START</span> Paramètres</div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
